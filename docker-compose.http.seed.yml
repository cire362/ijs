# Local development HTTP + seed override; never use on a public production server.
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.http.seed.yml up -d --build

services:
  db:
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ijshub}
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    environment:
      NODE_ENV: development
      COOKIE_SECURE: "false"

  web:
    environment:
      # Run Caddy in plain HTTP mode (no certificates) for this override.
      DOMAIN: ${HTTP_DOMAIN:-:80}

  seed:
    build: ./backend
    environment:
      NODE_ENV: development
      ALLOW_SEED: "1"
      DATABASE_URL: ${DATABASE_URL:?Set the local database URL}
      SEED_FORCE: ${SEED_FORCE:-0}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:?Set an explicit local seed password}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-0}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    command: npm run seed
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: "no"
