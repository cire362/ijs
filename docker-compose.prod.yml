x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging: *logs
  restart: unless-stopped

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated administrator password}
      POSTGRES_DB: ${POSTGRES_DB:-ijshub}
      APP_DB_USER: ${APP_DB_USER:-ijs_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set a generated application database password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d ${POSTGRES_DB:-ijshub}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/ops/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backend]
    logging: *logs
    restart: unless-stopped
    mem_limit: 1g

  api:
    <<: *hardened
    build: ./backend
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set the application role PostgreSQL URL}
      JWT_SECRET: ${JWT_SECRET:?Set a generated JWT secret}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set a separate generated refresh secret}
      OPS_TOKEN: ${OPS_TOKEN:?Set a separate generated operations token}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set real HTTPS application origins}
      APP_ORIGIN: ${APP_ORIGIN:?Set the canonical HTTPS application origin}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TRUST_PROXY: ${BACKEND_SUBNET:-172.30.50.0/24}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      EVENT_TIME_ZONE: ${EVENT_TIME_ZONE:-Europe/Moscow}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      RUN_SCHEDULED_JOBS: "true"
      WEB_CONCURRENCY: "1"
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      SHUTDOWN_TIMEOUT_MS: 25000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "node -e \"fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes: ["uploads:/app/uploads"]
    networks: [backend, api_egress]
    stop_grace_period: 35s
    cpus: 2
    mem_limit: 768m

  web:
    build:
      context: .
      dockerfile: ./caddy/Dockerfile
    environment:
      DOMAIN: ${DOMAIN:?Set the real domain}
    ports: ["80:80", "443:443"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes: ["caddy_data:/data", "caddy_config:/config"]
    networks: [edge, backend]
    logging: *logs
    restart: unless-stopped

  backup:
    <<: *hardened
    build:
      context: ./backend
      dockerfile: ops/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the application role PostgreSQL URL}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set a generated encryption key}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_MIRROR_DIR: /mirror
      OPS_TEMP_DIR: /work
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - uploads:/uploads:ro
      - backups:/backups
      - backup_work:/work
      - ${BACKUP_MIRROR_PATH:?Set a mounted independent backup destination}:/mirror
    networks: [backend]
    stop_grace_period: 16m
    mem_limit: 384m
    cpus: 1

  monitor:
    <<: *hardened
    build: ./backend
    command: [node, ops/monitor.js]
    environment:
      OPS_TOKEN: ${OPS_TOKEN:?Set the operations token}
      MONITOR_WEBHOOK_URL: ${MONITOR_WEBHOOK_URL:-}
    depends_on:
      api:
        condition: service_healthy
    volumes: ["backups:/backups:ro"]
    networks: [backend, edge]
    mem_limit: 128m
    cpus: 0.25

volumes:
  pgdata:
  uploads:
  backups:
  backup_work:
  caddy_data:
  caddy_config:

networks:
  edge:
  api_egress:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.30.50.0/24}
