# Override for running production stack on plain HTTP.
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.http.yml up -d --build

services:
  api:
    environment:
      # Force cookies without Secure flag (needed for HTTP).
      COOKIE_SECURE: "false"

  web:
    environment:
      # Run Caddy in plain HTTP mode (no certificates) for this override.
      DOMAIN: ${DOMAIN:-:80}
