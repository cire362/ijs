name: Backend

on:
  push:
    paths: ['backend/**', 'frontend/**', 'docker-compose*.yml', 'caddy/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'docker-compose*.yml', 'caddy/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ijs
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ijshub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ijs -d ijshub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ijs:ci_test_password@localhost:5432/ijshub_test
      JWT_SECRET: ci_only_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev

  production-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run ops:rehearse
