version: "3.9"
services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ijshub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    command: npm run start
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      PORT: ${PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/ijshub}
      JWT_SECRET: ${JWT_SECRET:-supersecret_jwt_key_change_me}
    ports:
      - "4000:4000"
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
volumes:
  pgdata:
